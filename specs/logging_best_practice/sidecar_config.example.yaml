# --- Vision ML System: Out-of-Process Log Shipper Specs ---
# This file provides reference configurations for production sidecar log shippers.
# Using a sidecar ensures the Python inference process incurs 0ms network latency.

# ==============================================================================
# OPTION 1: Vector (Recommended — High Performance, Rust-based, Low Memory)
# ==============================================================================
vector_config:
  sources:
    vision_ml_stdout:
      type: docker_logs # or 'file' / 'stdin'
      include_units: ["vision-ml-api"]

  transforms:
    parse_json:
      type: remap
      inputs: ["vision_ml_stdout"]
      source: |
        . = parse_json!(.message)
        .environment = get_env_var("APP_ENV") ?? "production"

  sinks:
    # Sink A: Grafana Loki (Recommended for Kubernetes/Cloud)
    loki_sink:
      type: loki
      inputs: ["parse_json"]
      endpoint: "http://loki:3100"
      labels:
        app: "vision-ml-system"
        level: "{{ level }}"
        logger: "{{ logger }}"
      encoding:
        codec: json

    # Sink B: AWS CloudWatch Logs (Alternative)
    cloudwatch_sink:
      type: aws_cloudwatch_logs
      inputs: ["parse_json"]
      group_name: "/vision-ml/production"
      stream_name: "inference-{{ host }}"
      encoding:
        codec: json

# ==============================================================================
# OPTION 2: Fluent Bit (Standard Edge / IoT Shipper)
# ==============================================================================
fluent_bit_config: |
  [SERVICE]
      Flush        1
      Daemon       Off
      Log_Level    info
      Parsers_File parsers.conf

  [INPUT]
      Name         tail
      Path         /app/logs/vision_ml.log
      Parser       json
      Tag          vision.ml.*
      Mem_Buf_Limit 5MB
      Skip_Long_Lines On

  [OUTPUT]
      Name         es
      Match        vision.ml.*
      Host         elasticsearch
      Port         9200
      Index        vision-ml-logs
      Type         _doc
